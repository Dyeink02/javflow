<main class="atlas-content-grid">
  <section class="atlas-panel atlas-ranking-panel" aria-labelledby="atlas-ranking-title">
    <div class="atlas-panel-head">
      <div><p class="atlas-panel-kicker">发现演员</p><h2 id="atlas-ranking-title">演员榜单</h2><p>按网站和时间浏览真实返回的榜单</p></div>
      <div class="atlas-panel-actions"><span id="atlas-ranking-total" class="atlas-panel-count">0 位</span><button id="atlas-refresh" class="ghost-button atlas-refresh-button" type="button">刷新榜单</button></div>
    </div>
    <section class="atlas-search-section" aria-label="演员搜索">
      <div class="atlas-operation-label"><span>演员搜索</span><small>独立查询公开演员目录</small></div>
      <div class="atlas-search-box"><label class="atlas-search-input-wrap" aria-label="搜索演员"><input id="atlas-search" class="atlas-search-input" type="search" placeholder="姓名、别名或罗马字" autocomplete="off" /></label><button id="atlas-search-button" class="primary-button" type="button">搜索</button></div>
      <p id="atlas-search-summary" class="atlas-search-summary">搜索会查询公开演员目录，不受榜单筛选限制。</p>
    </section>
    <div class="atlas-ranking-controls" aria-label="榜单筛选条件">
      <label class="atlas-control-field"><span>榜单网站</span><select id="atlas-source" class="atlas-ranking-select"><option value="smart">智能推荐</option><option value="fanza">FANZA 官方</option><option value="dmm">DMM 官方</option><option value="avfan">AVfan 在线</option><option value="local">本地历史</option></select></label>
      <div class="atlas-rank-tabs" role="tablist" aria-label="榜单类型"><button id="atlas-mode-monthly" class="atlas-rank-tab active" type="button">月榜</button><button id="atlas-mode-annual" class="atlas-rank-tab" type="button">年榜</button></div>
      <div class="atlas-control-row"><label class="atlas-control-field"><span>年份</span><select id="atlas-year" class="atlas-ranking-select"><option value="">自动</option></select></label><label id="atlas-month-field" class="atlas-control-field"><span>月份</span><select id="atlas-month" class="atlas-ranking-select"><option value="">自动</option></select></label></div>
    </div>
    <section class="atlas-proxy-section" aria-label="演员图鉴代理"><div class="atlas-operation-label"><span>代理服务器</span><span id="atlas-proxy-status" class="proxy-status-chip empty">未检测</span></div><div class="atlas-proxy-row"><label class="atlas-proxy-field"><input id="atlas-proxy" type="text" placeholder="http://127.0.0.1:7897" autocomplete="off" /></label><button id="atlas-proxy-save" class="ghost-button" type="button">应用</button></div><small id="atlas-proxy-status-detail" class="atlas-proxy-status-detail">输入代理后点击应用，软件会检测连接状态。</small></section>
    <div id="atlas-ranking-notice" class="atlas-ranking-context">正在读取预加载榜单。</div><div id="atlas-ranking-list" class="atlas-ranking-list" role="list"></div><p id="atlas-ranking-footer" class="atlas-ranking-footer"></p>
  </section>
  <section class="atlas-panel atlas-detail-panel" aria-labelledby="atlas-detail-title">
    <div id="atlas-detail-empty" class="atlas-detail-empty"><div><h2 id="atlas-detail-title">选择一位演员</h2><p>搜索或点击左侧榜单中的演员后，这里会显示真实头像、资料、公开照片、作品和操作入口。</p></div></div>
    <div id="atlas-detail" class="hidden">
      <div class="atlas-actor-header"><img id="atlas-actor-avatar" class="atlas-actor-avatar" alt="演员头像" /><div class="atlas-actor-copy"><div class="atlas-actor-name-line"><h2 id="atlas-actor-name">-</h2><span class="atlas-actor-badge">真实资料</span></div><p id="atlas-actor-meta" class="atlas-actor-alias">公开演员目录</p><div id="atlas-actor-profile" class="atlas-actor-profile"></div><div id="atlas-actor-stats" class="atlas-actor-stats"></div></div><div class="atlas-actor-actions"><button id="atlas-open-profile" class="ghost-button" type="button">打开 JAV 页面</button><button id="atlas-fill-crawler" class="primary-button" type="button">填充 JAV 爬虫</button><button id="atlas-subscribe" class="ghost-button" type="button">手动订阅</button></div></div>
      <section class="atlas-detail-section"><div class="atlas-section-head"><div><h3>公开照片</h3><p>只显示资料源实际返回、且不重复头像的图片。</p></div><span class="atlas-section-source">真实来源</span></div><div id="atlas-promo-grid" class="atlas-photo-grid"></div></section>
      <section class="atlas-detail-section"><div class="atlas-section-head"><div><h3>作品浏览</h3><p id="atlas-work-count">等待资料源返回作品列表</p></div><div class="atlas-work-controls"><span class="atlas-section-source">每页 8 部</span><button id="atlas-work-retry" class="ghost-button atlas-work-retry-button" type="button">重试失败封面</button><button id="atlas-work-previous" class="ghost-button atlas-work-page-button" type="button" disabled>上一页</button><span id="atlas-work-page-current" class="atlas-work-page-current" aria-live="polite">第 1 / 1 页</span><button id="atlas-work-next" class="ghost-button atlas-work-page-button" type="button" disabled>下一页</button></div></div><div id="atlas-works" class="atlas-work-grid"></div></section>
    </div>
  </section>
</main>
<section id="atlas-activity-log-panel" class="atlas-panel atlas-activity-log-panel hidden" aria-labelledby="atlas-activity-log-title"><div class="atlas-section-head"><div><h3 id="atlas-activity-log-title">运行日志</h3><p>记录演员资料、图片与作品请求的处理结果。</p></div><button id="atlas-activity-log-clear" class="ghost-button" type="button">清空日志</button></div><ol id="atlas-activity-log" class="atlas-activity-log" aria-live="polite"></ol></section>
</section>
