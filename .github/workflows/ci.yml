name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'wails-shell/go.mod'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Check encoding
        run: npm run check:encoding

      - name: Verify maintainability
        run: npm run verify:maintainability

      - name: Run Go tests
        working-directory: wails-shell
        run: go test ./...
