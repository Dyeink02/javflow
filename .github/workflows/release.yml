name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    # baseline-* tags are source-snapshot labels, not real releases
    if: ${{ !startsWith(github.ref, 'refs/tags/baseline-') }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'wails-shell/go.mod'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Run Go tests
        working-directory: wails-shell
        run: go test ./...

      - name: Build desktop frontend
        run: npm run build:desktop-frontend

      - name: Sync frontend to Wails
        run: npm run sync:wails-frontend

      - name: Build Wails EXE
        working-directory: wails-shell
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          wails build -ldflags "-X javflow/internal/appupdate.BuildVersion=$version"

      - name: Apply JavFlow icon and EXE metadata
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $env:JAVFLOW_BUILD_VERSION = $version
          node scripts/patch-exe-metadata.mjs

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Prepare portable and installer packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $exeSource = "wails-shell\build\bin\javflow.exe"
          if (-not (Test-Path $exeSource)) {
            Write-Error "EXE not found at $exeSource"
            exit 1
          }
          $releaseExe = "wails-shell\release\javflow.exe"
          New-Item -ItemType Directory -Force -Path "wails-shell\release" | Out-Null
          Copy-Item $exeSource $releaseExe -Force

          $env:JAVFLOW_BUILD_VERSION = $version
          node scripts/build-wails-dual-packages.js

          $packageDirectory = "wails-shell\release\packages"
          $portableName = "JavFlow-Portable-$version.exe"
          $portableSource = "$packageDirectory\JavFlow-Lite-Direct-$version.exe"
          $installerName = "JavFlow-Installer-$version.exe"
          $installerSource = "$packageDirectory\$installerName"
          foreach ($artifactPath in @($portableSource, $installerSource)) {
            if (-not (Test-Path $artifactPath)) {
              Write-Error "Release artifact not found at $artifactPath"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path "release-staging" | Out-Null
          Copy-Item $portableSource "release-staging\$portableName"
          Copy-Item $installerSource "release-staging\$installerName"

          # Keep this exact file name for pre-0.4.41 clients that select
          # javflow.exe when applying their legacy online update.
          Copy-Item $exeSource "release-staging\javflow.exe"

          Write-Output "Portable: release-staging\$portableName"
          Write-Output "Installer: release-staging\$installerName"
          Write-Output "Legacy update asset: release-staging\javflow.exe"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            release-staging/JavFlow-Portable-*.exe
            release-staging/JavFlow-Installer-*.exe
            release-staging/javflow.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
