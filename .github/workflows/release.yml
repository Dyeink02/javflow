name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    # baseline-* tags are source-snapshot labels, not real releases
    if: ${{ !startsWith(github.ref, 'refs/tags/baseline-') }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'wails-shell/go.mod'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Run Go tests
        working-directory: wails-shell
        run: go test ./...

      - name: Build desktop frontend
        run: npm run build:desktop-frontend

      - name: Sync frontend to Wails
        run: npm run sync:wails-frontend

      - name: Build Wails EXE
        working-directory: wails-shell
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          wails build -ldflags "-X javflow/internal/appupdate.BuildVersion=$version"

      - name: Apply JavFlow icon and EXE metadata
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $env:JAVFLOW_BUILD_VERSION = $version
          node scripts/patch-exe-metadata.mjs

      - name: Prepare portable package
        shell: pwsh
        run: |
          # Use git tag version (strips 'v' prefix) for artifact naming
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $staging = "release-staging\JavFlow-Portable-$version"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy EXE
          $exeSource = "wails-shell\build\bin\javflow.exe"
          if (-not (Test-Path $exeSource)) {
            Write-Error "EXE not found at $exeSource"
            exit 1
          }
          Copy-Item $exeSource "$staging\javflow.exe"

          # The Wails renderer is embedded in the EXE. The files below are
          # still required by the retained Node compatibility lane, including
          # the Cloudflare/age-verification path. Keep them in the portable
          # package so an in-place ZIP update does not produce a partial app.
          Copy-Item -Recurse "desktop" "$staging\desktop"
          Copy-Item -Recurse "dist" "$staging\dist"
          Copy-Item "package.json" "$staging\package.json"
          Copy-Item "package-lock.json" "$staging\package-lock.json"

          $nodePath = (Get-Command node -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path "$staging\runtime\node" | Out-Null
          Copy-Item $nodePath "$staging\runtime\node\node.exe"

          Push-Location $staging
          try {
            npm ci --omit=dev --ignore-scripts
            if ($LASTEXITCODE -ne 0) {
              throw "无法为便携包安装生产依赖，退出码：$LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          # Create ZIP
          $zipName = "JavFlow-Portable-$version.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath "release-staging\$zipName"

          # Generate SHA-256
          $hash = (Get-FileHash "release-staging\$zipName" -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -Encoding ascii "release-staging\$zipName.sha256"

          Write-Output "EXE path: $exeSource"
          Write-Output "ZIP: release-staging\$zipName"
          Write-Output "SHA256: $hash"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            release-staging/*.zip
            release-staging/*.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
